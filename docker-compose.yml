version: '3.8'

services:
  music-cotmix-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: music-cotmix-ai:latest
    container_name: music-cotmix-ai-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - BACKBONE=cnn
      - MODEL_PATH=models/checkpoints/music_cotmix_cnn.pt
      - DEVICE=cpu
      - CONFIDENCE_THRESHOLD=0.80
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
