name: AI Model CD Pipeline (Build & Publish to Docker Hub)

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Custom Image Tag (leave empty for default latest)'
        required: false
        default: 'latest'

jobs:
  build-and-publish:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-arch support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/music-cotmix-ai
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag
            type=raw,value=${{ github.event.inputs.image_tag }},enable=${{ github.event.inputs.image_tag != '' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Published Container Image
        env:
          IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/music-cotmix-ai:latest
        run: |
          echo "Pulling and testing published Docker container..."
          docker run -d --name test-ai-container -p 8000:8000 $IMAGE_NAME
          
          # Wait up to 30 seconds for FastAPI model loading
          echo "Waiting for container startup..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/health | grep -q '"status":"ok"'; then
              echo "Container health check PASSED!"
              docker stop test-ai-container && docker rm test-ai-container
              exit 0
            fi
            sleep 1
          done
          
          echo "Health check failed! Printing container logs:"
          docker logs test-ai-container
          docker stop test-ai-container && docker rm test-ai-container
          exit 1
